[project]
name = "ilanbot"
version = "0.1.0"
description = "KPSS ile başvurulan kamu ilanlarını takip edip Telegram'dan bildiren bot"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
