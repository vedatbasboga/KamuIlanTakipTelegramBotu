# Kamu İlan Botu ayarları
#
# Not: Filtreden geçmeyen ilanlar da "görüldü" olarak kaydedilir. Filtreleri sonradan
# değiştirirsen, daha önce görülmüş eski ilanlar geriye dönük olarak GELMEZ; sadece bundan
# sonra çıkan ilanlara yeni filtre uygulanır.

sources:            # kaynak aç/kapa (true = takip et, false = atla)
  kamuilan_sbb: true
  ilan_gov: true
  kariyer_kapisi: true
  iskur: true
  resmi_gazete: false              # kapalı: erişim güvenilmez, içerik ilan.gov.tr'de var (docs/kaynaklar.md)
  yerel_yonetimler: true

# Hangi kaynak nerede çalışır (`python -m ilanbot --runner <ad>`).
# GitHub'ın yurt dışı sunucuları kamuilan, Kariyer Kapısı ve Yerel Yönetimler'i engelliyor
# (erişim testi 2026-10-19, docs/kaynaklar.md); bunlar kullanıcının bilgisayarındaki
# self-hosted runner'da çalışır. Bir kaynak tek bir ortamda olmalı.
runners:
  github: [ilan_gov, iskur, resmi_gazete]
  local: [kamuilan_sbb, kariyer_kapisi, yerel_yonetimler]

filters:
  # Şu an tüm filtreler kapalı: bot herkese açık kullanım için tüm kamu ilanlarını gönderir.
  # Kişisel kullanımda daraltmak için aşağıdaki listeleri doldur.

  # Geçerli değerler: ortaogretim, onlisans, lisans, yuksek_lisans, doktora
  education_levels: []                # boş liste = filtre yok (ör. [lisans, onlisans])
  # Puan türleri: P3, P93, P94, P121 ... ("KPSS P3" yazımı da kabul edilir)
  kpss_types: []                      # boş liste = filtre yok (ör. [P3])
  # İl adları (ör. [İzmir, Ankara]). "Türkiye geneli" ilanlar her il filtresiyle eşleşir.
  locations: []                       # boş = tüm Türkiye
  # Başlık + kurum + özet içinde en az biri geçmeli (Türkçe, büyük/küçük harf duyarsız)
  include_keywords: []                # boş = şart yok
  # Biri geçerse ilan her zaman elenir. Örnekler:
  #   akademik: "öğretim üyesi", "öğretim görevlisi", "araştırma görevlisi"
  #   işçi:     "işçi"
  #   askeri:   "subay", "astsubay"
  #   duyuru:   "iptal ilanı", "düzeltme ilanı"
  exclude_keywords: []
  # Bir ilanda filtrelenen alan (öğrenim, KPSS, il) okunamadıysa ilanı yine de gönder.
  # Kaçırılan ilan, fazladan gelen bildirimden daha kötüdür.
  filtre_belirsizse_gonder: true

notify:
  max_messages_per_run: 15            # aşılırsa tek bir özet mesaj gönderilir
  show_deadline_days_left: true       # "(9 gün kaldı)" bilgisini göster

state:
  prune_after_days: 120               # bu kadar günden eski "görüldü" kayıtları silinir
