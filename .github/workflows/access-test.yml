name: Erişim testi

# GitHub runner'larının (yurt dışı IP) kaynaklara erişip erişemediğini ölçer. Sadece elle çalışır.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kaynaklara erişim
        env:
          PYTHONPATH: src
        run: python scripts/access_test.py
