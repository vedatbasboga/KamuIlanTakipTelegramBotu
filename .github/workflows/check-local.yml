name: İlan kontrolü (bilgisayar)

# GitHub'ın yurt dışı sunucularının erişemediği kaynaklar (config.yaml → runners.local) kullanıcının
# Windows bilgisayarındaki self-hosted runner'da çalışır. Bilgisayar kapalıyken çalışma kuyrukta
# bekler; açılınca en fazla bir tanesi çalışır.
on:
  schedule:
    # TR saatiyle 07:22–23:52 arası her 30 dakikada bir. GitHub tarafı (:07, :37) ile çakışmasın.
    - cron: "22,52 4-20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: bildirim gönderme, state kaydetme"
        type: boolean
        default: false

permissions:
  contents: write # state commit'i için

concurrency:
  group: ilanbot-local
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    defaults:
      run:
        # Windows PowerShell 5.1, git'in stderr'e yazdığı ilerleme mesajlarını hata sayabiliyor.
        shell: cmd
    steps:
      - uses: actions/checkout@v5

      - name: Python ortamı
        run: |
          set "VENV=%USERPROFILE%\.ilanbot-venv"
          if not exist "%VENV%\Scripts\python.exe" python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install -q --disable-pip-version-check -r requirements.txt || exit /b 1

      - name: İlanları kontrol et
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          "%USERPROFILE%\.ilanbot-venv\Scripts\python.exe" -m ilanbot --runner local --state data/state-local.json ${{ inputs.dry_run && '--dry-run' || '' }}

      # Bot kısmen hata verse de görülen ilanlar kaybolmasın diye her durumda çalışır.
      - name: State'i kaydet
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "ilanbot" || exit /b 1
          git config user.email "ilanbot@users.noreply.github.com" || exit /b 1
          git add data/state-local.json || exit /b 1
          git diff --cached --quiet && exit /b 0
          git commit -m "state (bilgisayar)" || exit /b 1
          git pull --rebase || exit /b 1
          git push || exit /b 1
